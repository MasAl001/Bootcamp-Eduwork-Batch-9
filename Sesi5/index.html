<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toko Online Sederhana</title>
    <!-- Memuat CSS dari Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- CSS -->
     <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

    <!-- Navigasi Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">TokoKita</a>
            <span class="navbar-text text-white">
                Belanja Mudah dan Cepat
            </span>
        </div>
    </nav>

    <!-- Kontainer Utama -->
    <div class="container">
        
        <!-- Bagian Header & Filter -->
        <div class="row mb-4 align-items-center">
            <div class="col-md-6">
                <h2 class="mb-0">Daftar Produk</h2>
            </div>
            <div class="col-md-6 text-md-end mt-3 mt-md-0">
                <div class="d-inline-flex align-items-center">
                    <label for="filterKategori" class="form-label mb-0 me-2 fw-bold text-nowrap">Filter Kategori:</label>
                    <select id="filterKategori" class="form-select shadow-sm" onchange="filterProduk()">
                        <option value="Semua">Semua Kategori</option>
                        <option value="Elektronik">Elektronik</option>
                        <option value="Pakaian">Pakaian</option>
                        <option value="Buku">Buku</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Tempat produk akan ditampilkan oleh JavaScript -->
        <div class="row" id="wadah-produk">
            <!-- Elemen produk (Card) akan dimuat di sini -->
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
