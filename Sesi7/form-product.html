<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Produk Baru</title>
    <!-- Memuat Bootstrap CSS dari CDN untuk styling yang cepat dan responsif -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa; /* Warna latar belakang abu-abu terang */
            padding-top: 50px;
        }
        .form-container {
            background-color: #ffffff; /* Latar belakang form putih */
            padding: 30px;
            border-radius: 10px; /* Sudut melengkung */
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); /* Bayangan halus */
            max-width: 600px;
            margin: auto;
        }
        .form-title {
            margin-bottom: 20px;
            font-weight: bold;
            color: #333;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="form-container">
        <h2 class="form-title text-center">Tambah Produk Baru</h2>
        
        <!-- Form action menunjuk ke file PHP yang akan memproses data, menggunakan method POST dan enctype untuk file upload -->
        <form action="process-product.php" method="POST" enctype="multipart/form-data">
            
            <!-- Input Nama Produk -->
            <div class="mb-3">
                <label for="productName" class="form-label">Nama Produk</label>
                <input type="text" class="form-control" id="productName" name="productName" placeholder="Masukkan nama produk" required>
                <div class="form-text text-muted">Contoh: Sepatu Sneakers, Kaos Polos.</div>
            </div>

            <!-- Input Kategori -->
            <div class="mb-3">
                <label for="productCategory" class="form-label">Kategori</label>
                <select class="form-select" id="productCategory" name="productCategory" required>
                    <option value="" selected disabled>Pilih Kategori...</option>
                    <option value="pakaian">Pakaian</option>
                    <option value="elektronik">Elektronik</option>
                    <option value="makanan">Makanan</option>
                    <option value="minuman">Minuman</option>
                    <option value="lainnya">Lainnya</option>
                </select>
            </div>

            <!-- Baris untuk Harga dan Stok agar terlihat rapi (Grid system) -->
            <div class="row">
                <!-- Input Harga -->
                <div class="col-md-6 mb-3">
                    <label for="productPrice" class="form-label">Harga (Rp)</label>
                    <input type="number" class="form-control" id="productPrice" name="productPrice" placeholder="0" min="0" required>
                </div>
                
                <!-- Input Stok -->
                <div class="col-md-6 mb-3">
                    <label for="productStock" class="form-label">Stok Awal</label>
                    <input type="number" class="form-control" id="productStock" name="productStock" placeholder="0" min="0" required>
                </div>
            </div>

            <!-- Input Deskripsi -->
            <div class="mb-3">
                <label for="productDescription" class="form-label">Deskripsi Produk</label>
                <textarea class="form-control" id="productDescription" name="productDescription" rows="4" placeholder="Jelaskan detail produk secara singkat..."></textarea>
            </div>

            <!-- Input Gambar Produk -->
            <div class="mb-3">
                <label for="productImage" class="form-label">Gambar Produk</label>
                <input class="form-control" type="file" id="productImage" name="productImage" accept="image/*" required>
                <div class="form-text text-muted">Format yang didukung: JPG, PNG, GIF. Maksimal 2MB.</div>
            </div>

            <!-- Tombol Submit -->
            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-primary btn-lg">Simpan Produk</button>
            </div>
        </form>
    </div>
</div>

<!-- Memuat Bootstrap JS (opsional, dibutuhkan jika ada elemen interaktif seperti dropdown/modal dari Bootstrap) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
